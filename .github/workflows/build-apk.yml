name: Build & Release RailLog APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Signing Keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore from repository secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > raillog-release.jks
          else
            echo "Secrets KEYSTORE_BASE64 not set. Generating CI signing keystore to ensure APK is always signed and installable..."
            keytool -genkeypair -v \
              -keystore raillog-release.jks \
              -alias raillog \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass RailLog2026SecureKey \
              -keypass RailLog2026SecureKey \
              -dname "CN=Mateusz Szerszen, OU=RailLog CI, O=RailLog, L=Bydgoszcz, ST=Kujawsko-Pomorskie, C=PL"
          fi

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD || 'RailLog2026SecureKey' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'raillog' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'RailLog2026SecureKey' }}

      - name: Package Distributable APK Files
        run: |
          mkdir -p dist
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/RailLog-release.apk
            cp app/build/outputs/apk/release/app-release.apk dist/RailLog-v2.1.1-release.apk
            # Backwards compatibility copies
            cp app/build/outputs/apk/release/app-release.apk dist/TaktRail-release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/RailLog-debug.apk
            cp app/build/outputs/apk/debug/app-debug.apk dist/TaktRail-debug.apk
          fi
          echo "Dist folder contents:"
          ls -lh dist

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raillog-debug-apk
          path: dist/RailLog-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raillog-release-apk
          path: dist/RailLog-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release (Tag Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "RailLog ${{ github.ref_name }} — Premium Redesign"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Release (Latest on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "RailLog — Najnowsza wersja (Automatyczne wydanie)"
          body: |
            ## 🚆 RailLog — Nowoczesny Dziennik Służb Maszynisty
            Automatyczna kompilacja z gałęzi `main`.

            ### 📲 Pobierz i zainstaluj:
            - **[RailLog-release.apk](https://github.com/mateuszsz3623/RailLog/releases/download/latest/RailLog-release.apk)** (Zalecana wersja instalacyjna)
            - **[RailLog-debug.apk](https://github.com/mateuszsz3623/RailLog/releases/download/latest/RailLog-debug.apk)** (Wersja debugerska)
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
