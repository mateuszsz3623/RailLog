name: Build & Release RailLog APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract app version
        id: ver
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Wykryta wersja aplikacji: $VER"

      - name: Configure Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$RELEASE_KEYSTORE_PASSWORD" ] || [ -z "$RELEASE_KEY_PASSWORD" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "::warning::Brak sekretów podpisu (KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_PASSWORD) - PR buduje się bez podpisu release."
            else
              echo "::error::Brak sekretów podpisu: wymagane KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD i RELEASE_KEY_PASSWORD. Nie wydaję APK podpisanego innym kluczem."
              exit 1
            fi
          else
            echo "$KEYSTORE_BASE64" | base64 --decode > raillog-release.jks
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Run Lint
        run: ./gradlew lintDebug

      - name: Build Debug & Release APKs
        run: |
          ./gradlew assembleDebug
          ./gradlew assembleRelease
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Package Distributable APK Files
        run: |
          mkdir -p dist
          if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/RailLog-release.apk
          fi
          if [ -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/RailLog-debug.apk
          fi
          echo "Dist folder contents:"
          ls -lh dist

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raillog-debug-apk
          path: dist/RailLog-debug.apk
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: raillog-release-apk
          path: dist/RailLog-release.apk
          if-no-files-found: warn

      - name: Publish GitHub Release (Tag Release)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "RailLog ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean old assets in latest release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ids=$(gh api repos/${{ github.repository }}/releases/tags/latest --jq '.assets[].id' 2>/dev/null || true)
          for id in $ids; do gh api -X DELETE repos/${{ github.repository }}/releases/assets/$id || true; done

      - name: Publish GitHub Release (Latest on Main)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest"
          name: "RailLog ${{ steps.ver.outputs.version }} — Najnowsza wersja (Automatyczne wydanie)"
          body: |
            ### Wersja **${{ steps.ver.outputs.version }}**

            ## 🚆 RailLog — Prywatny dziennik służb maszynisty na Androida

            RailLog to elegancka aplikacja dla maszynistów kolejowych do rejestrowania służb: odcinki trasy z pojazdami trakcyjnymi (seria + numer), czas trwania, nadgodziny i statystyki miesięczne. Działa w 100% offline — bez kont, chmury i telemetrii, a dane zostają wyłącznie na Twoim telefonie. Eksport do CSV pod polski Excel oraz pełny backup JSON z przywracaniem.

            ### 📲 Pliki
            - **[RailLog-release.apk](https://github.com/mateuszsz3623/RailLog/releases/download/latest/RailLog-release.apk)** — wersja produkcyjna (**zalecana**)
            - **[RailLog-debug.apk](https://github.com/mateuszsz3623/RailLog/releases/download/latest/RailLog-debug.apk)** — wersja diagnostyczna (do testów)

            ### 💡 Instalacja
            Pobierz `RailLog-release.apk`, otwórz go na telefonie i zezwól na instalację z nieznanych źródeł. Aktualizacja instaluje się **ponad starą wersję bez utraty danych** — bez odinstalowywania aplikacji.
          draft: false
          prerelease: false
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Keep README version in sync
        if: github.ref == 'refs/heads/main'
        run: |
          VER="${{ steps.ver.outputs.version }}"
          sed -i "s|^\*\*Aktualna wersja: .*\*\*$|**Aktualna wersja: ${VER}**|" README.md
          if git diff --quiet -- README.md; then
            echo "README.md bez zmian — wersja już aktualna."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "docs: wersja w README zaktualizowana do ${VER}"
            git push
            echo "README.md zaktualizowany do ${VER} i wypchnięty."
          fi

      - name: Publish APKs to apk-latest branch
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ steps.ver.outputs.version }}"
          TMP=$(mktemp -d)
          cp "$GITHUB_WORKSPACE"/dist/*.apk "$TMP"/
          cd "$TMP"
          cat > POBIERZ.md <<EOF
          # RailLog — najnowsza wersja

          ## Wersja: ${VER}

          Zbudowano: $(date +'%Y-%m-%d %H:%M') UTC

          ## Pliki
          - **RailLog-release.apk** — wersja produkcyjna (**zalecana**)
          - **RailLog-debug.apk** — wersja diagnostyczna (do testów)

          ---

          Gałąź utrzymywana automatycznie przez CI — zawsze zawiera najnowsze APK.
          EOF
          git init -b apk-latest
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "RailLog ${VER} — najnowsze APK"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apk-latest
